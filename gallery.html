    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
        <i class="fas fa-times lightbox-close" onclick="closeLightbox(event)"></i>
        <div class="lightbox-crop">
            <img id="lightbox-img" src="" alt="Full View">
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // ── Lightbox ──
        function openLightbox(el) {
            var src = el.querySelector('img').src;
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').classList.add('active');
        }
        function closeLightbox(e) {
            if (e.target.id === 'lightbox' || e.target.classList.contains('lightbox-close')) {
                document.getElementById('lightbox').classList.remove('active');
            }
        }

        // ── Tabbed Slider ──
        (function() {
            var allSlides = document.querySelectorAll('.gallery-slide');
            var tabs = document.querySelectorAll('.gallery-tab');
            var dotsContainer = document.getElementById('slider-dots');
            var counter = document.getElementById('slider-counter');
            var currentCategory = 'kitchen';
            var currentIndex = 0;
            var categorySlides = [];

            function getSlides(cat) {
                return Array.from(document.querySelectorAll('.gallery-slide[data-category="' + cat + '"]'));
            }

            function showSlide(index) {
                // Hide all slides
                allSlides.forEach(function(s) { s.classList.remove('active'); });

                categorySlides = getSlides(currentCategory);
                if (index < 0) index = categorySlides.length - 1;
                if (index >= categorySlides.length) index = 0;
                currentIndex = index;

                categorySlides[currentIndex].classList.add('active');
                updateDots();
                updateCounter();
            }

            function updateDots() {
                dotsContainer.innerHTML = '';
                categorySlides.forEach(function(_, i) {
                    var dot = document.createElement('button');
                    dot.className = 'slider-dot' + (i === currentIndex ? ' active' : '');
                    dot.setAttribute('aria-label', 'Go to image ' + (i + 1));
                    dot.addEventListener('click', function() { showSlide(i); });
                    dotsContainer.appendChild(dot);
                });
            }

            function updateCounter() {
                counter.textContent = (currentIndex + 1) + ' / ' + categorySlides.length;
            }

            function switchCategory(cat) {
                currentCategory = cat;
                currentIndex = 0;

                tabs.forEach(function(t) { t.classList.remove('active'); });
                document.querySelector('.gallery-tab[data-category="' + cat + '"]').classList.add('active');

                showSlide(0);
            }

            // Tab clicks
            tabs.forEach(function(tab) {
                tab.addEventListener('click', function() {
                    switchCategory(this.dataset.category);
                });
            });

            // Arrow clicks
            document.getElementById('slider-prev').addEventListener('click', function() {
                showSlide(currentIndex - 1);
            });
            document.getElementById('slider-next').addEventListener('click', function() {
                showSlide(currentIndex + 1);
            });

            // Keyboard navigation
            document.addEventListener('keydown', function(e) {
                if (document.getElementById('lightbox').classList.contains('active')) return;
                if (e.key === 'ArrowLeft') showSlide(currentIndex - 1);
                if (e.key === 'ArrowRight') showSlide(currentIndex + 1);
            });

            // Touch swipe support
            var slider = document.getElementById('gallery-slider');
            var touchStartX = 0;
            slider.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });
            slider.addEventListener('touchend', function(e) {
                var diff = touchStartX - e.changedTouches[0].screenX;
                if (Math.abs(diff) > 50) {
                    if (diff > 0) showSlide(currentIndex + 1);
                    else showSlide(currentIndex - 1);
                }
            }, { passive: true });

            // Init
            switchCategory('kitchen');
        })();
    </script>
